openapi: 3.1.0
info:
  title: Aclymate Carbon Accounting API
  description: Carbon accounting tools for SMBs — powered by Aclymate. Estimate footprints, look up emission factors, explain GHG Protocol scopes, browse the factor catalog, and benchmark against industry peers. All responses use Aclymate's FM §4 structured envelope.
  version: 0.1.0
servers:
  - url: https://mcp.aclymate.com
paths:
  /estimate-emissions:
    post:
      operationId: estimateEmissions
      summary: Estimate annual carbon footprint
      description: Estimates the annual carbon footprint (tCO2e) for a business based on its industry, size, and location. Returns a Scope 1/2/3 breakdown and the biggest emission drivers as structured envelope fields.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [industry, employees]
              properties:
                industry:
                  type: string
                  description: The business industry or type (e.g. 'restaurant', 'consulting firm', 'retail store')
                employees:
                  type: number
                  description: Number of employees
                location:
                  type: string
                  description: City, state, or country. Optional — used to refine electricity grid emission factors.
                additionalContext:
                  type: string
                  description: Any additional context about the business (e.g. 'operates 3 locations', 'heavy business travel', 'mostly remote'). Optional.
      responses:
        "200":
          description: Emissions estimate envelope with Scope 1/2/3 breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /explain-scope:
    post:
      operationId: explainScope
      summary: Explain GHG Protocol emission scopes
      description: Explains GHG Protocol Scope 1, 2, or 3 emissions in the context of a specific industry or business type.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: ["1", "2", "3", "all"]
                  description: Which GHG Protocol scope to explain
                industry:
                  type: string
                  description: The industry or business type. Optional — omit for a general explanation.
      responses:
        "200":
          description: Scope explanation envelope tailored to the industry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /get-emission-factor:
    post:
      operationId: getEmissionFactor
      summary: Look up an emission factor
      description: Returns the emission factor for a specific activity. On canonical hit, returns a structured value/source block. On miss, falls back to Aclymate's Climate Brain (marked with `climate_brain_fallback` warning + low confidence).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity]
              properties:
                activity:
                  type: string
                  description: The activity to get an emission factor for (e.g. 'short-haul flight', 'natural gas combustion', 'US average electricity', 'gasoline vehicle per mile')
                unit:
                  type: string
                  description: The unit you want the factor in (e.g. 'per mile', 'per kWh', 'per kg'). Optional — if omitted, the most common unit is returned.
      responses:
        "200":
          description: Emission factor envelope with source, confidence, and warnings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /compare-footprint:
    post:
      operationId: compareFootprint
      summary: Benchmark against industry peers
      description: Compares a company's carbon footprint against industry benchmarks. Shows whether emissions are above, below, or in line with peers, and what top performers do differently.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [industry, employees]
              properties:
                industry:
                  type: string
                  description: The business industry or type
                employees:
                  type: number
                  description: Number of employees
                totalTonsCo2e:
                  type: number
                  description: The company's total annual emissions in tCO2e. Optional — if omitted, returns the benchmark range without a comparison.
      responses:
        "200":
          description: Industry benchmark envelope with comparison if actual emissions provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  # B-Tier1-browse — 5 catalog browse tools returning the FM §4 structured envelope

  /lookup-factor-by-id:
    post:
      operationId: lookupFactorById
      summary: Look up an emission factor by canonical id
      description: Deterministic exact-match lookup by `factor_id`. Returns `result: null` with a `factor_not_found` warning if the id is unknown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_id]
              properties:
                factor_id:
                  type: string
                  description: The canonical factor id (e.g. 'egrid-akgd-2019').
      responses:
        "200":
          description: Factor envelope with the matching factor or a factor_not_found warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /find-factor:
    post:
      operationId: findFactor
      summary: Find an emission factor by keys
      description: Keyed lookup — returns the first factor matching `factor_type` + `keys`. Assertion mode; empty keys, unknown keys, or no-match all return `result: null` with a descriptive warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_type]
              properties:
                factor_type:
                  type: string
                  description: The canonical factor type (e.g. 'egrid', 'flight', 'fuel').
                keys:
                  type: object
                  description: Key/value map identifying the factor (e.g. `{egrid_region: 'AKGD', vintage_year: 2019}`).
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number
                      - type: boolean
      responses:
        "200":
          description: Factor envelope with the matching factor or a null result + warning
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /search-factors:
    post:
      operationId: searchFactors
      summary: Keyword search across the factor catalog
      description: Keyword search across factor ids, categories, aliases, and search terms. Capped at 25 results; a `result_truncated` warning surfaces the true total. Empty results return an empty list plus a warning, never an error.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: A keyword or short phrase.
                factor_type:
                  type: string
                  description: Optional — scope the search to a single factor type.
      responses:
        "200":
          description: Search results envelope with up to 25 factors + count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /list-factor-types:
    post:
      operationId: listFactorTypes
      summary: List every factor type in the catalog
      description: Returns the full sorted list of canonical factor types (e.g. `egrid`, `flight`, `fuel`, `ceda_sector`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        "200":
          description: Factor types envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /list-factor-key-values:
    post:
      operationId: listFactorKeyValues
      summary: List distinct values for a factor-type key
      description: Enumerate distinct values for `key_name` under `factor_type`. Omitting `key_name` uses the factor_type's designated drill key with a `drill_key_defaulted` warning.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [factor_type]
              properties:
                factor_type:
                  type: string
                  description: The canonical factor type.
                key_name:
                  type: string
                  description: Optional — the specific key to enumerate (e.g. 'egrid_region').
      responses:
        "200":
          description: Key values envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  # B-Tier1-calcs — 7 calc-based tools returning the FM §4 structured envelope

  /calculate-flight-emissions:
    post:
      operationId: calculateFlightEmissions
      summary: Calculate flight emissions
      description: Calculate tCO2e for a flight using Aclymate's DEFRA-based factors. Pass `distance` in km if you can compute it (preferred), `{to, from}` coordinate objects as an alternative, or omit both for a US-domestic NYC↔LA ballpark.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                distance:
                  type: number
                  description: Round-trip distance in kilometers. Preferred input.
                passClass:
                  type: string
                  enum: [economy, premium, business, first]
                  description: Cabin class. Omit for DEFRA average across classes.
                to:
                  type: object
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                  required: [lat, lng]
                from:
                  type: object
                  properties:
                    lat: { type: number }
                    lng: { type: number }
                  required: [lat, lng]
      responses:
        "200":
          description: Flight emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-train-emissions:
    post:
      operationId: calculateTrainEmissions
      summary: Calculate train emissions
      description: Calculate tCO2e for a passenger train trip. Requires `mileage` in miles. Optional `trainType` (defaults to intercity-other). `isNortheastCorridor: true` overrides `trainType` and applies the NEC factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mileage]
              properties:
                mileage:
                  type: number
                  description: Trip distance in miles.
                trainType:
                  type: string
                  enum: [lightRail, regionalRail, intercityRail]
                  description: Rail service type. Omit for intercity-other default.
                isNortheastCorridor:
                  type: boolean
                  description: True for Amtrak NEC service; overrides trainType.
      responses:
        "200":
          description: Train emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-other-transport-emissions:
    post:
      operationId: calculateOtherTransportEmissions
      summary: Calculate other-transport emissions
      description: Calculate tCO2e for bus, rail, carpool, or walk/bike. Both fields required. Unknown transportation types are rejected — no silent zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transportationType, mileage]
              properties:
                transportationType:
                  type: string
                  enum: [bus, lightRail, regionalRail, intercityRail, carpool, walkBike]
                  description: Transportation type.
                mileage:
                  type: number
                  description: Trip distance in miles.
      responses:
        "200":
          description: Other-transport emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-electricity-emissions:
    post:
      operationId: calculateElectricityEmissions
      summary: Calculate electricity emissions
      description: Calculate tCO2e for electricity usage. Requires `unitValue` and `unit` (`kwh` or `mwh`). Optional `eGrid` accepts a US eGRID subregion code, a Canadian province, or a country name. Default MROE is a conservative upper-bound US subregion. Optional `date` picks the data year.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitValue, unit]
              properties:
                unitValue:
                  type: number
                  description: Positive electricity quantity.
                unit:
                  type: string
                  enum: [kwh, mwh]
                  description: Only kwh and mwh accepted.
                eGrid:
                  type: string
                  description: US eGRID subregion, Canadian province, or country. Default MROE.
                date:
                  type: string
                  description: Optional ISO date. Data year walks down to closest available.
      responses:
        "200":
          description: Electricity emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-gas-emissions:
    post:
      operationId: calculateGasEmissions
      summary: Calculate gas / fuel emissions
      description: Calculate tCO2e for natural gas, propane, heating oil, or wood combustion. Accepted `unit` depends on `fuelType`. Invalid (fuelType, unit) pairs are rejected at parse time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fuelType, unitValue]
              properties:
                fuelType:
                  type: string
                  enum: [naturalGas, propane, heatingOil, wood]
                unit:
                  type: string
                  description: >
                    naturalGas → therms|mcf|ccf|scf|cubicMeters (default therms);
                    propane → scf|gallons (default gallons);
                    heatingOil → gallons;
                    wood → cords.
                unitValue:
                  type: number
                  description: Positive quantity in the specified unit.
      responses:
        "200":
          description: Gas emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-diet-emissions:
    post:
      operationId: calculateDietEmissions
      summary: Calculate diet emissions
      description: Calculate monthly and annual tCO2e for a diet type across N people. sad = Standard American Diet; had-1/had-2/had-3 = Healthy American Diet tiers (had-3 is most plant-forward).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dietType]
              properties:
                dietType:
                  type: string
                  enum: [sad, had-1, had-2, had-3]
                numPeople:
                  type: integer
                  description: Number of people on this diet. Defaults to 1.
      responses:
        "200":
          description: Diet emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /calculate-pet-emissions:
    post:
      operationId: calculatePetEmissions
      summary: Calculate pet emissions
      description: Calculate monthly and annual tCO2e for pets. All counts default to 0. Large dogs count at 2× the dog factor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numDogs:
                  type: integer
                  description: Number of dogs (default 0).
                numCats:
                  type: integer
                  description: Number of cats (default 0).
                numLargeDogs:
                  type: integer
                  description: Number of large dogs (default 0).
      responses:
        "200":
          description: Pet emissions envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

  /recommend-emissions-reductions:
    post:
      operationId: recommendEmissionsReductions
      summary: Recommend emissions reductions
      description: Returns 3-6 opinionated, industry-specific carbon-reduction levers for a business (title, description, targeted scope, impact, effort, first step). Focuses on operational reductions; does not cover offsets, certifications, or framework work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [industry, employees]
              properties:
                industry:
                  type: string
                  description: The business industry or type (e.g. 'restaurant', 'SaaS company', 'law firm')
                employees:
                  type: number
                  description: Number of employees
                scopeFocus:
                  type: string
                  enum: ["1", "2", "3", "all"]
                  description: Which GHG Protocol scope the recommendations should focus on. Optional — defaults to 'all'.
                additionalContext:
                  type: string
                  description: Any additional context about the business (e.g. 'operates 3 locations', 'mostly remote'). Optional.
      responses:
        "200":
          description: Reduction-recommendations envelope with a structured recommendations array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolEnvelope"

components:
  schemas:
    ToolEnvelope:
      type: object
      description: FM §4 structured response envelope shared across every Aclymate MCP tool — catalog browse, calc, estimate, explain, and benchmark.
      properties:
        attribution:
          type: object
          properties:
            name: { type: string }
            url: { type: string }
            methodology_link:
              type: string
              nullable: true
        result:
          type: object
          nullable: true
          description: Tool-specific payload (e.g. `{ tCO2e, ... }` for calcs, `{ factor_types: [...] }` for list_factor_types). Null on error or when the query yielded no match.
        sources:
          type: array
          items:
            type: object
        confidence:
          type: string
          enum: [low, medium, high]
          nullable: true
        warnings:
          type: array
          items:
            type: object
            properties:
              code: { type: string }
              message: { type: string }
        factor_snapshot:
          type: object
          nullable: true
          properties:
            package: { type: string }
            version: { type: string }
            git_commit_sha:
              type: string
              nullable: true
        methodology_url:
          type: string
          nullable: true
        view_in_aclymate_url:
          type: string
          nullable: true
        upgrade_hint:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }
            http_status: { type: integer }
